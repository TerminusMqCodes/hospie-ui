image: node:20                    # Node.js 20 LTS for Vue.js/Quasar development

clone:
  depth: full                    # SonarQube Cloud scanner needs the full history to assign issues properly

definitions:
  caches:
    sonar: ~/.sonar/cache        # Caching SonarQube Cloud artifacts will speed up your build
    npm: ~/.npm                  # Cache npm dependencies
    
  steps:
    - step: &build-test-sonarcloud-local
        name: Build, test and analyze on SonarQube Cloud (Local Runner)
        runs-on:
          - 'self.hosted'        # Use local runner
        caches:
          - node                 # Cache Node.js modules
          - npm                  # Cache npm cache
          - sonar               # Cache SonarQube artifacts
        script:
          # Install dependencies
          - npm ci
          
          # Install Quasar CLI globally
          - npm install -g @quasar/cli
          
          # Lint the code
          - npm run lint
          
          # Format check
          - npm run format
          
          # Run tests
          - npm run test
          
          # Build the project with full memory available
          - NODE_OPTIONS="--max-old-space-size=8192" npm run build
          
          # Generate test coverage
          - npm run test:coverage
          
          # Run SonarQube analysis with full memory
          - pipe: sonarsource/sonarcloud-scan:4.0.0
            variables:
              SONAR_TOKEN: $SONAR_TOKEN
              SONAR_SCANNER_OPTS: "-Xmx4096m -XX:+UseG1GC"
              EXTRA_ARGS: >
                -Dsonar.projectKey=hospie-ui
                -Dsonar.organization=$SONAR_ORGANIZATION
                -Dsonar.sources=src
                -Dsonar.tests=src
                -Dsonar.test.inclusions=**/*.spec.js,**/*.test.js,**/*.spec.ts,**/*.test.ts
                -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/dist-pwa/**,**/dist-electron/**,**/*.min.js,**/coverage/**,**/.quasar/**
                -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
                -Dsonar.typescript.lcov.reportPaths=coverage/lcov.info
                -Dsonar.scm.disabled=false
                -Dsonar.javascript.file.suffixes=.js,.jsx
                -Dsonar.typescript.file.suffixes=.ts,.tsx,.vue
              
    - step: &check-quality-gate-sonarcloud
        name: Check the Quality Gate on SonarQube Cloud
        runs-on:
          - 'self.hosted'        # Use local runner
        script:
          - pipe: sonarsource/sonarcloud-quality-gate:0.1.6
            variables:
              SONAR_TOKEN: $SONAR_TOKEN
            
    - step: &build-production-local
        name: Build for Production (Local Runner)
        runs-on:
          - 'self.hosted'        # Use local runner
        caches:
          - node
          - npm
        script:
          # Install dependencies
          - npm ci
          
          # Install Quasar CLI globally
          - npm install -g @quasar/cli
          
          # Build for production with full memory
          - NODE_OPTIONS="--max-old-space-size=8192" npm run build
          
          # Build PWA version with full memory
          - NODE_OPTIONS="--max-old-space-size=8192" npm run build:pwa
          
          # Build Electron version
          - NODE_OPTIONS="--max-old-space-size=8192" npm run build:electron
          
        artifacts:
          - dist/**
          - dist-pwa/**
          - dist-electron/**
          
    - step: &security-scan-local
        name: Security Vulnerability Scan (Local Runner)
        runs-on:
          - 'self.hosted'        # Use local runner
        script:
          # Install dependencies
          - npm ci
          
          # Run comprehensive security audit
          - npm audit --audit-level=low
          
          # Check for outdated packages
          - npm outdated
          
          # Run additional security checks
          - npx audit-ci --config audit-ci.json || echo "Security audit completed"

    - step: &performance-test-local
        name: Performance Testing (Local Runner)
        runs-on:
          - 'self.hosted'        # Use local runner
        script:
          # Install dependencies
          - npm ci
          
          # Build for performance testing
          - NODE_OPTIONS="--max-old-space-size=8192" npm run build
          
          # Run bundle analyzer
          - npx quasar build --analyze || echo "Bundle analysis completed"
          
          # Check bundle size
          - du -sh dist/
          - find dist/ -name "*.js" -exec ls -lh {} \; | head -10

pipelines:                       # Optimized for local runner with full resources
  branches:
    master:
      - step: *build-test-sonarcloud-local
      - step: *check-quality-gate-sonarcloud
      - step: *build-production-local
      - step: *security-scan-local
      - step: *performance-test-local
      
    main:
      - step: *build-test-sonarcloud-local
      - step: *check-quality-gate-sonarcloud
      - step: *build-production-local
      - step: *security-scan-local
      
    develop:
      - step: *build-test-sonarcloud-local
      - step: *check-quality-gate-sonarcloud
      
  pull-requests:
    '**':
      - step: *build-test-sonarcloud-local
      - step: *check-quality-gate-sonarcloud
      
  tags:
    'v*':
      - step: *build-test-sonarcloud-local
      - step: *check-quality-gate-sonarcloud
      - step: *build-production-local
      - step: *security-scan-local
      - step: *performance-test-local
      
  custom:
    # Full comprehensive pipeline
    full-analysis:
      - step: *build-test-sonarcloud-local
      - step: *check-quality-gate-sonarcloud
      - step: *build-production-local
      - step: *security-scan-local
      - step: *performance-test-local
      
    # Quick build for development
    quick-build:
      - step:
          name: Quick Build (Local Runner)
          runs-on:
            - 'self.hosted'
          script:
            - npm ci
            - npm install -g @quasar/cli
            - npm run lint
            - NODE_OPTIONS="--max-old-space-size=8192" npm run build
            
    # Manual deployment pipeline
    deploy-staging:
      - step: *build-test-sonarcloud-local
      - step: *check-quality-gate-sonarcloud
      - step: *build-production-local
      - step:
          name: Deploy to Staging (Local Runner)
          runs-on:
            - 'self.hosted'
          deployment: staging
          script:
            - echo "Deploy to staging server"
            # Add your staging deployment commands here
            
    deploy-production:
      - step: *build-test-sonarcloud-local
      - step: *check-quality-gate-sonarcloud
      - step: *build-production-local
      - step:
          name: Deploy to Production (Local Runner)
          runs-on:
            - 'self.hosted'
          deployment: production
          trigger: manual
          script:
            - echo "Deploy to production server"
            # Add your production deployment commands here