# SonarQube Project Configuration for Hospie UI

# Project identification
sonar.projectKey=hospie-ui
sonar.projectName=Hospie UI
sonar.projectVersion=1.0.0

# Source code configuration
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.js,**/*.test.js,**/*.spec.ts,**/*.test.ts

# Exclusions - exclude build artifacts and dependencies
sonar.exclusions=**/node_modules/**,**/dist/**,**/dist-pwa/**,**/dist-electron/**,**/*.min.js,**/coverage/**,**/.quasar/**,**/public/**,**/build/**

# Language-specific settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx,.vue

# Code coverage exclusions
sonar.coverage.exclusions=**/*.spec.js,**/*.test.js,**/*.spec.ts,**/*.test.ts,**/main.js,**/main.ts,**/boot/**,**/router/**

# Duplication exclusions
sonar.cpd.exclusions=**/*.spec.js,**/*.test.js,**/*.spec.ts,**/*.test.ts,**/i18n/**

# Quality gate settings
sonar.qualitygate.wait=true

# Performance settings
sonar.scm.disabled=false
sonar.scm.provider=git

# Analysis timeout (30 minutes)
sonar.ws.timeout=1800