# SonarQube Project Configuration for Hospie UI

# Project identification
sonar.projectKey=hospie-ui
sonar.projectName=Hospie UI
sonar.projectVersion=1.0.0

# Source code configuration
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.js,**/*.test.js,**/*.spec.ts,**/*.test.ts

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/dist-pwa/**,**/dist-electron/**,**/*.min.js,**/coverage/**,**/.quasar/**,**/public/**

# Language-specific settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Code coverage
sonar.coverage.exclusions=**/*.spec.js,**/*.test.js,**/*.spec.ts,**/*.test.ts,**/main.js,**/main.ts

# Duplication exclusions
sonar.cpd.exclusions=**/*.spec.js,**/*.test.js,**/*.spec.ts,**/*.test.ts

# Quality gate settings
sonar.qualitygate.wait=true

# Additional settings for Vue.js
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx,.vue